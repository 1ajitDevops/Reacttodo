trigger:
- main

pool:
  name: 'selfhostedagent'

variables:
  sonarProjectKey: '1ajitDevops_Reacttodo'
  sonarOrganization: '1ajitdevops'

steps:
# 1. Node.js Setup
- task: NodeTool@0
  inputs:
    versionSpec: '18.x'
  displayName: 'Install Node.js'

# 2. SonarScanner Global Install & Run
- script: |
    npm install -g sonar-scanner
    npm install
  displayName: 'Install Dependencies & Sonar Scanner'

# 3. React Build
- script: |
    npm run build
  displayName: 'Build React App'

# 4. SonarCloud Scan Run (Direct CLI)
- script: |
    sonar-scanner \
      -Dsonar.projectKey=$(sonarProjectKey) \
      -Dsonar.organization=$(sonarOrganization) \
      -Dsonar.sources=. \
      -Dsonar.host.url=https://sonarcloud.io
  displayName: 'Run SonarCloud Scan'
  env:
    SONAR_TOKEN: '1ajitDevops_Reacttodo' # Aapka Sonar Token yahan add karein agar zarurat ho

# 5. Zip Build Artifact
- task: ArchiveFiles@2
  inputs:
    rootFolderOrFile: '$(System.DefaultWorkingDirectory)/build'
    includeRootFolder: false
    archiveType: 'zip'
    archiveFile: '$(Build.ArtifactStagingDirectory)/build.zip'
    replaceExistingArchive: true
  displayName: 'Package Build Artifact'

# 6. Artifact Publish
- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)/build.zip'
    ArtifactName: 'drop'
    publishLocation: 'Container'
  displayName: 'Publish Pipeline Artifact'
