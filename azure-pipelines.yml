trigger:
- main

pool:
  name: 'selfhostedagent'

variables:
  sonarProjectKey: '1ajitDevops_Reacttodo'
  sonarOrganization: '1ajitdevops'

steps:
# 1. Node.js Setup
- task: NodeTool@0
  inputs:
    versionSpec: '18.x'
  displayName: 'Install Node.js'

# 2. Dependencies Install
- script: |
    npm install
    npm install -g sonar-scanner
  displayName: 'Install Dependencies & CLI Tools'

# 3. React Build (CI=false bypasses Babel warnings)
- script: |
    set CI=false
    npx react-scripts build
  displayName: 'Build React App'

# 4. SonarCloud Scan
- script: |
    npx sonar-scanner -Dsonar.projectKey=$(sonarProjectKey) -Dsonar.organization=$(sonarOrganization) -Dsonar.sources=. -Dsonar.host.url=https://sonarcloud.io
  displayName: 'Run SonarCloud Scan'

# 5. Zip Build Artifact
- task: ArchiveFiles@2
  inputs:
    rootFolderOrFile: '$(System.DefaultWorkingDirectory)/build'
    includeRootFolder: false
    archiveType: 'zip'
    archiveFile: '$(Build.ArtifactStagingDirectory)/build.zip'
    replaceExistingArchive: true
  displayName: 'Package Build Artifact'

# 6. Artifact Publish
- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)/build.zip'
    ArtifactName: 'drop'
    publishLocation: 'Container'
  displayName: 'Publish Pipeline Artifact'
