trigger:
- main

pool:
  name: 'selfhostedagent'

variables:
  sonarProjectKey: '1ajitDevops_Reacttodo'
  sonarOrganization: '1ajitdevops'

steps:
# 1. Node.js setup
- task: NodeTool@0
  inputs:
    versionSpec: '18.x'
  displayName: 'Install Node.js'

# 2. Dependencies install karna
- script: |
    npm install
  displayName: 'Install Dependencies'

# 3. SonarQube/SonarCloud Prepare Task
- task: SonarQubePrepare@1
  inputs:
    SonarQube: 'SonarCloudConnection'
    organization: '$(sonarOrganization)'
    scannerMode: 'CLI'
    configMode: 'manual'
    cliProjectKey: '$(sonarProjectKey)'
    cliProjectName: 'Reacttodo'
    cliSources: '.'

# 4. React App Build
- script: |
    npm run build
  displayName: 'Build React App'

# 5. SonarQube/SonarCloud Analysis
- task: SonarQubeAnalyze@1
  displayName: 'Run SonarCloud Analysis'

# 6. Quality Gate Result
- task: SonarQubePublish@1
  inputs:
    pollingTimeoutSec: '300'
  displayName: 'Publish SonarCloud Quality Gate'

# 7. Zip Build Artifact
- task: ArchiveFiles@2
  inputs:
    rootFolderOrFile: '$(System.DefaultWorkingDirectory)/build'
    includeRootFolder: false
    archiveType: 'zip'
    archiveFile: '$(Build.ArtifactStagingDirectory)/build.zip'
    replaceExistingArchive: true
  displayName: 'Package Build Artifact'

# 8. Artifact Publish
- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)/build.zip'
    ArtifactName: 'drop'
    publishLocation: 'Container'
  displayName: 'Publish Pipeline Artifact'
